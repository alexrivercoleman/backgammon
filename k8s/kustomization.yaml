# Apply with: kubectl apply -k k8s   (make up does this against the k3d cluster)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tavli
labels:
  - pairs:
      app.kubernetes.io/part-of: tavli
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
