# Local stack. `make compose-up` builds and runs everything at http://localhost:${APP_PORT:-8088}; Postgres is
# reachable only inside the compose network, so a database already on the host's 5432 doesn't clash.
# `make db-up` starts only Postgres, adding docker-compose.dev.yml to publish it on 5432 for hot-reload
# development with the backend and Vite running on the host. The credentials are for local use only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tavli
      POSTGRES_USER: tavli
      POSTGRES_PASSWORD: tavli
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavli -d tavli"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tavli
      SPRING_DATASOURCE_USERNAME: tavli
      SPRING_DATASOURCE_PASSWORD: tavli
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
