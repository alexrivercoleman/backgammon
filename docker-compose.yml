# Local development services. The backend and frontend run on the host for now;
# containerised app services are added in a later session.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tavli
      POSTGRES_USER: tavli
      POSTGRES_PASSWORD: tavli
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavli -d tavli"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
