spring.application.name=tavli

# Defaults match docker-compose.yml; override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/tavli
spring.datasource.username=tavli
spring.datasource.password=tavli

# Turn graphs repeat boards heavily, so JSON compresses well.
server.compression.enabled=true

# Health checks for Docker and Kubernetes. Only health is exposed. Liveness says the process is up; readiness
# also needs the database, so traffic waits until Postgres is reachable.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-components=always
